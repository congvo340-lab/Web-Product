<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=qq, initial-scale=1.0">
    <link rel="stylesheet" href="test.css">
    <title>Form</title>
</head>
<body>
    <form action="index.html">
        <fieldset style="width: 300;">
            <h1>Create Account</h1>
            <p>Join us today! Fill in the details to get started</p>
            <label for="name"><b>Full Name</b></label>
            <br>
            <input type="text" name="name" id="name" placeholder="Enter your full name">
            <br>
            <br>
            <label for="email"><b>Email Address</b></label>
            <br>
            <input type="email" name="email" id="email" placeholder="Enter your mail">
            <br>
            <br>
            <label for="pass"><b>Password</b></label>
            <br>
            <input type="password" name="pass" id="pass" placeholder="Create a password">
            <br>
            <br>
            <label for="cpass"><b>Confirm Password</b></label>
            <br>
            <input type="password" name="cpass" id="cpass" placeholder="Confirm your password">
            <br>
            <br>
            <label for=""><b>Gender</b></label>
            <br>
            <input type="radio" name="gen" id="male"><span>Male</span>
            <input type="radio" name="gen"><span>Female</span>
            <input type="radio" name="gen"><span>Others</span>
            <br>
            <br>
            <input type="checkbox"><span>I agree to the <a href="">terms & conditions</a> and <a href="">privacy policy</a></span>
            <br>
            <br>
            <button type="submit">Sign Up</button>
            <br>
            <p>Already have an account? <a href="">Login</a></p>

        </fieldset>        
    </form>
    
    
</body>
</html>
