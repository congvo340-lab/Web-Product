<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        html{
            background-color: aliceblue;
            margin: 0;
        }
        body{
            margin: 3% auto;
            box-sizing: border-box;
            width: 95%;
            background-color: rgba(206, 211, 212, 0.884);
        }
        div{
            overflow:hidden;
            padding: 3px;
        }
        label{
            width: 25%;
            float: left;
        }
        [id^=k]{
            width: 75%;
            float: right;
        }
    </style>
</head>
<body>
    <div>
        <label for="k1">First Name</label>
        <input type="text" id="k1">
    </div>
    <div>
        <label for="k2">Last Name</label>
        <input type="text" id="k2">
    </div>
    <div>
        <label for="k3">Country</label>
        <input type="text" id="k3">
    </div>
    <div>
        <label for="k4">Subject</label>
        <textarea name="no name" id="k4"></textarea>
    </div>
    
</body>
</html>
